name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source
        run: bun run check

      - name: Build release artifacts
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bun run release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/zcode-acp-darwin-arm64
          dist/zcode-acp-darwin-x64
          dist/zcode-acp-linux-arm64
          dist/zcode-acp-linux-x64
          dist/zcode-acp-windows-x64.exe
          dist/SHA256SUMS
          dist/sbom.spdx.json
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
